[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-document-platform"
version = "0.1.0"
description = "FastAPI/Celery industrial document processing and review platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<6",
  "celery[redis]>=5.4,<6",
  "minio>=7.2,<8",
  "pypdf>=5.1,<6",
  "defusedxml>=0.7,<1",
  "python-multipart>=0.0.20,<1",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<25",
  "jinja2>=3.1,<4",
  "prometheus-client>=0.21,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-redis>=4.6,<5",
  "pre-commit>=4,<5",
]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires PostgreSQL, Redis and MinIO",
  "e2e: requires a running Docker Compose stack",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_ignores = true
ignore_missing_imports = true

